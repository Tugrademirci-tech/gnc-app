<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jugendgruppe</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#1b2a24;--ac:#0f7b5f;--mu:#6b7a73;--bd:#dfe5e2}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--card:#1c2522;--tx:#e8efec;--ac:#2fb58f;--mu:#93a39b;--bd:#2c3833}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:640px;margin:auto;padding:12px 12px 80px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%;margin:4px 0}
button{background:var(--ac);color:#fff;border:0;cursor:pointer}button.s{background:var(--bd);color:var(--tx)}
button.d{background:#c0392b;width:auto;padding:4px 8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{background:none;color:var(--mu);border-radius:0;margin:0;font-size:12px;padding:12px 2px}nav button.on{color:var(--ac);font-weight:700}
.row{display:flex;gap:8px}.row>*{flex:1}.mu{color:var(--mu);font-size:13px}.big{font-size:28px;font-weight:700}
.li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.msg{padding:6px 10px;margin:4px 0;border-radius:10px;background:var(--bg);max-width:85%}.msg.me{margin-left:auto;background:var(--ac);color:#fff}
.plus{color:#1e8e3e}.minus{color:#c0392b}.box{max-height:45vh;overflow:auto}
#arrow{width:0;height:0;margin:20px auto;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:90px solid var(--ac);transition:transform .2s}
[hidden]{display:none!important}
</style></head><body>
<main>
<div id="login" class="card" style="margin-top:20vh">
 <h2>Anmelden</h2>
 <input id="lu" placeholder="Benutzername" autocapitalize="none" autocomplete="username">
 <input id="lp" type="password" placeholder="Passwort" autocomplete="current-password">
 <button id="lb">Anmelden</button><p id="le" class="minus"></p>
</div>

<div id="app" hidden>
 <div class="row" style="align-items:center"><b id="who"></b><button class="s" id="out" style="flex:0 0 auto;width:auto">Abmelden</button></div>

 <section id="t-kasse"><div class="card"><div class="mu">Saldo (Einnahmen − Ausgaben)</div><div class="big" id="saldo">0,00 €</div>
  <div class="mu" id="sub"></div></div>
  <div class="card"><input id="ki" placeholder="Was? (z.B. Cola-Kasten)"><div class="row"><input id="ka" type="number" step="0.01" placeholder="Betrag €"><select id="kt"><option value="aus">Ausgabe (gekauft)</option><option value="ein">Einnahme (verkauft)</option></select></div>
  <button id="kb">Eintragen</button></div><div class="card" id="kl"></div></section>

 <section id="t-da" hidden><div class="card"><div class="row"><button id="vin">✅ Ich bin da</button><button id="vout" class="s">🚪 Ich gehe</button></div></div><div class="card" id="vl"></div></section>

 <section id="t-chat" hidden><div class="card box" id="cl"></div><div class="row"><input id="ci" placeholder="Nachricht an alle…"><button id="cb" style="flex:0 0 90px">Senden</button></div></section>

 <section id="t-dm" hidden><select id="dmu"></select><div class="card box" id="dl"></div><div class="row"><input id="di" placeholder="Private Nachricht…"><button id="db" style="flex:0 0 90px">Senden</button></div></section>

 <section id="t-gebet" hidden>
  <div class="card"><div class="mu" id="loc"></div><div class="big" id="next">…</div><div class="mu" id="cd"></div><div id="times"></div>
   <button id="nb" class="s">🔔 Benachrichtigungen aktivieren</button><div class="mu">Benachrichtigungen kommen nur, solange die Seite geöffnet ist.</div></div>
  <div class="card" style="text-align:center"><b>Qibla</b><div id="qd" class="mu"></div><div id="arrow"></div><button id="cp" class="s">🧭 Kompass starten</button></div></section>

 <section id="t-admin" hidden><div class="card"><b>Neuen Nutzer anlegen</b>
  <input id="nu" placeholder="Benutzername" autocapitalize="none"><input id="np" placeholder="Start-Passwort (min. 6 Zeichen)"><button id="nbn">Anlegen</button><p id="ne" class="mu"></p></div>
  <div class="card" id="ul"></div></section>
</main>
<nav id="nav" hidden><button data-t="kasse" class="on">💶<br>Kasse</button><button data-t="da">🏠<br>Anwesenheit</button><button data-t="chat">💬<br>Chat</button><button data-t="dm">🔒<br>Privat</button><button data-t="gebet">🕌<br>Gebet</button><button data-t="admin" id="adm" hidden>⚙️<br>Admin</button></nav>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,addDoc,onSnapshot,query,orderBy,limit,where,doc,getDoc,setDoc,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== HIER DEINE FIREBASE-DATEN EINTRAGEN (siehe Anleitung) ====== */
const cfg={apiKey:"AIzaSyA6Kd-5QJXxF81JbcUTrhHeYNEc7hNKv4Y",authDomain:"gnc-app-4fe92.firebaseapp.com",projectId:"gnc-app-4fe92",appId:"1:421586664920:web:9deee49ea2c8dab17d06ad"};
/* =================================================================== */

const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=i=>document.getElementById(i);
const mail=u=>u.trim().toLowerCase().replace(/\s+/g,"")+"@gnc.de";
const eur=n=>n.toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const tm=t=>t?.toDate?t.toDate().toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"…";
const el=(tag,txt,cls)=>{const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;return e};
let me=null,users=[],unsubs=[],dmAll=[];

$("lb").onclick=async()=>{$("le").textContent="";try{await signInWithEmailAndPassword(auth,mail($("lu").value),$("lp").value)}catch(e){$("le").textContent="Benutzername oder Passwort falsch."}};
$("lp").onkeydown=e=>e.key==="Enter"&&$("lb").click();
$("out").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
 unsubs.forEach(f=>f());unsubs=[];
 if(!u){me=null;$("app").hidden=$("nav").hidden=true;$("login").hidden=false;return}
 const s=await getDoc(doc(db,"users",u.uid));
 if(!s.exists()){$("le").textContent="Kein Profil gefunden – bitte den Admin fragen.";signOut(auth);return}
 me={uid:u.uid,...s.data()};
 $("login").hidden=true;$("app").hidden=$("nav").hidden=false;$("who").textContent="👤 "+me.name;
 $("adm").hidden=me.role!=="admin";start();
});

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
 document.querySelectorAll("main section").forEach(s=>s.hidden=s.id!=="t-"+b.dataset.t);
});

function start(){
 // Kasse
 unsubs.push(onSnapshot(query(collection(db,"purchases"),orderBy("ts","desc"),limit(300)),sn=>{
  let ein=0,aus=0;const box=$("kl");box.replaceChildren();
  sn.forEach(d=>{const x=d.data();x.type==="ein"?ein+=x.amount:aus+=x.amount;
   const r=el("div","","li"),l=el("div",x.item+" · "+x.by+" · "+tm(x.ts));
   const a=el("b",(x.type==="ein"?"+":"−")+eur(x.amount),x.type==="ein"?"plus":"minus");r.append(l,a);
   if(me.role==="admin"){const b=el("button","✕","d");b.onclick=()=>deleteDoc(d.ref);r.append(b)}box.append(r)});
  const s=ein-aus;$("saldo").textContent=eur(s);$("saldo").className="big "+(s<0?"minus":"plus");
  $("sub").textContent="Einnahmen "+eur(ein)+" · Ausgaben "+eur(aus)}));
 // Anwesenheit
 unsubs.push(onSnapshot(query(collection(db,"visits"),orderBy("ts","desc"),limit(100)),sn=>{
  const box=$("vl");box.replaceChildren();sn.forEach(d=>{const x=d.data(),r=el("div","","li");
   r.append(el("span",(x.type==="ein"?"✅ ":"🚪 ")+x.name),el("span",tm(x.ts),"mu"));box.append(r)})}));
 // Chat
 unsubs.push(onSnapshot(query(collection(db,"chat"),orderBy("ts","desc"),limit(100)),sn=>{
  const box=$("cl");box.replaceChildren();[...sn.docs].reverse().forEach(d=>{const x=d.data();
   const m=el("div","","msg"+(x.uid===me.uid?" me":""));m.append(el("div",x.by+" · "+tm(x.ts),"mu"),el("div",x.text));box.append(m)});box.scrollTop=box.scrollHeight}));
 // Nutzer + privat
 unsubs.push(onSnapshot(collection(db,"users"),sn=>{
  users=sn.docs.map(d=>({uid:d.id,...d.data()}));
  const cur=$("dmu").value;$("dmu").replaceChildren(el("option","Person wählen…"));$("dmu").firstChild.value="";
  users.filter(u=>u.uid!==me.uid).forEach(u=>{const o=el("option",u.name);o.value=u.uid;$("dmu").append(o)});$("dmu").value=cur;
  renderUsers();renderDM()}));
 unsubs.push(onSnapshot(query(collection(db,"dm"),where("participants","array-contains",me.uid)),sn=>{dmAll=sn.docs.map(d=>d.data());renderDM()}));
 prayer();
}
$("kb").onclick=async()=>{const a=parseFloat($("ka").value);if(!$("ki").value.trim()||!(a>0))return;
 await addDoc(collection(db,"purchases"),{item:$("ki").value.trim(),amount:a,type:$("kt").value,by:me.name,uid:me.uid,ts:serverTimestamp()});$("ki").value=$("ka").value=""};
const visit=t=>addDoc(collection(db,"visits"),{name:me.name,uid:me.uid,type:t,ts:serverTimestamp()});
$("vin").onclick=()=>visit("ein");$("vout").onclick=()=>visit("aus");
$("cb").onclick=async()=>{const t=$("ci").value.trim();if(!t)return;$("ci").value="";await addDoc(collection(db,"chat"),{text:t,by:me.name,uid:me.uid,ts:serverTimestamp()})};
$("ci").onkeydown=e=>e.key==="Enter"&&$("cb").click();
function renderDM(){const p=$("dmu").value,box=$("dl");box.replaceChildren();if(!p||!me)return;
 dmAll.filter(x=>x.participants.includes(p)).sort((a,b)=>(a.ts?.seconds||9e9)-(b.ts?.seconds||9e9)).forEach(x=>{
  const m=el("div","","msg"+(x.from===me.uid?" me":""));m.append(el("div",x.text),el("div",tm(x.ts),"mu"));box.append(m)});box.scrollTop=box.scrollHeight}
$("dmu").onchange=renderDM;
$("db").onclick=async()=>{const t=$("di").value.trim(),p=$("dmu").value;if(!t||!p)return;$("di").value="";
 await addDoc(collection(db,"dm"),{text:t,from:me.uid,to:p,participants:[me.uid,p],ts:serverTimestamp()})};
$("di").onkeydown=e=>e.key==="Enter"&&$("db").click();

// Admin
function renderUsers(){const box=$("ul");box.replaceChildren();users.forEach(u=>{const r=el("div","","li");r.append(el("span",u.name+(u.role==="admin"?" (Admin)":"")));
 if(me.role==="admin"&&u.uid!==me.uid){const b=el("button","Entfernen","d");b.onclick=()=>confirm(u.name+" entfernen?")&&deleteDoc(doc(db,"users",u.uid));r.append(b)}box.append(r)})}
$("nbn").onclick=async()=>{const n=$("nu").value.trim(),p=$("np").value;$("ne").textContent="";if(!n||p.length<6){$("ne").textContent="Name und mind. 6 Zeichen Passwort nötig.";return}
 try{const sec=initializeApp(cfg,"sec"+Date.now()),sa=getAuth(sec);
  const c=await createUserWithEmailAndPassword(sa,mail(n),p);
  await setDoc(doc(db,"users",c.user.uid),{name:n,role:"user"});await signOut(sa);
  $("ne").textContent="✔ "+n+" angelegt.";$("nu").value=$("np").value=""}
 catch(e){$("ne").textContent="Fehler: "+(e.code||e.message)}};

// Gebetszeiten
let coords=JSON.parse(localStorage.getItem("c")||"null")||{lat:53.7,lon:9.98,n:"Norderstedt (Standard)"},T=null,done={};
const NAMES={Fajr:"Fajr",Dhuhr:"Dhuhr",Asr:"Asr",Maghrib:"Maghrib",Isha:"Isha"};
async function prayer(){
 navigator.geolocation?.getCurrentPosition(p=>{coords={lat:p.coords.latitude,lon:p.coords.longitude,n:"Dein Standort"};localStorage.setItem("c",JSON.stringify(coords));load()},load,{timeout:6000});
 if(!T)load()}
async function load(){
 $("loc").textContent="📍 "+coords.n;
 try{const d=new Date(),r=await fetch(`https://api.aladhan.com/v1/timings/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}?latitude=${coords.lat}&longitude=${coords.lon}&method=13`);
  T=(await r.json()).data.timings;done={};drawTimes();qibla()}catch(e){$("next").textContent="Zeiten nicht ladbar"}}
const at=s=>{const[h,m]=s.slice(0,5).split(":"),d=new Date();d.setHours(+h,+m,0,0);return d};
function drawTimes(){if(!T)return;const box=$("times");box.replaceChildren();
 Object.keys(NAMES).forEach(k=>{const r=el("div","","li");r.append(el("span",NAMES[k]),el("b",T[k].slice(0,5)));box.append(r)})}
setInterval(()=>{if(!T)return;const now=new Date();let nx=null;
 for(const k in NAMES){const t=at(T[k]);if(t>now){nx=[k,t];break}
  if(Math.abs(now-t)<60000&&!done[k]){done[k]=1;if(Notification.permission==="granted")new Notification("🕌 Gebetszeit: "+NAMES[k],{body:T[k].slice(0,5)+" Uhr"})}}
 if(!nx){nx=["Fajr",new Date(at(T.Fajr).getTime()+864e5)]}
 const m=Math.round((nx[1]-now)/6e4);$("next").textContent=NAMES[nx[0]]+" · "+nx[1].toTimeString().slice(0,5);
 $("cd").textContent="in "+Math.floor(m/60)+" Std "+m%60+" Min"},5000);
$("nb").onclick=async()=>{if(!("Notification" in window))return alert("Dieser Browser unterstützt keine Benachrichtigungen.");
 const p=await Notification.requestPermission();$("nb").textContent=p==="granted"?"🔔 Aktiv":"Benachrichtigungen blockiert"};

// Qibla
let qb=0,hd=null;
function qibla(){const r=x=>x*Math.PI/180,f1=r(coords.lat),f2=r(21.4225),dl=r(39.8262-coords.lon);
 qb=(Math.atan2(Math.sin(dl)*Math.cos(f2),Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl))*180/Math.PI+360)%360;
 $("qd").textContent="Qibla: "+Math.round(qb)+"° von Norden"+(hd==null?" (Kompass starten, dann Pfeil folgen)":"");turn()}
function turn(){$("arrow").style.transform=`rotate(${qb-(hd||0)}deg)`}
function ori(e){const h=e.webkitCompassHeading??(e.absolute&&e.alpha!=null?360-e.alpha:null);if(h==null||isNaN(h))return;hd=h;turn();
 const diff=Math.abs(((qb-h+540)%360)-180);$("qd").textContent="Qibla: "+Math.round(qb)+"°"+(diff<5?" ✅ Richtung stimmt":"")}
$("cp").onclick=async()=>{try{if(typeof DeviceOrientationEvent!=="undefined"&&DeviceOrientationEvent.requestPermission){if(await DeviceOrientationEvent.requestPermission()!=="granted")return}
 addEventListener("deviceorientationabsolute",ori,true);addEventListener("deviceorientation",ori,true);$("cp").hidden=true}catch(e){alert("Kompass nicht verfügbar")}};
</script></body></html>
